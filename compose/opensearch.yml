# OpenSearch single-node cluster for Smart Briefing.
#
# Bring up:
#   docker compose -f compose/opensearch.yml up -d
#
# OpenSearch will be available at https://opensearch:9200 (in the docker network)
# or https://localhost:9200 (from the host).
#
# Default credentials: admin / OPENSEARCH_INITIAL_ADMIN_PASSWORD (from .env).
# The security plugin is enabled — first connect requires this password.
#
# Self-signed certs are generated on first run; n8n's HTTP nodes need
# "Ignore SSL Issues" enabled in the HTTP Request node options.

services:
  opensearch:
    image: opensearchproject/opensearch:3.6.0
    container_name: opensearch
    environment:
      - cluster.name=smart-briefing
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - briefing
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -ks -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health | grep -E 'green|yellow' >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  opensearch_data:

networks:
  briefing:
    name: briefing
